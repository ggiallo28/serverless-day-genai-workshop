AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Resources for Q&A Application using Amazon Bedrock - Retrieve API, backed by
  Amazon S3 Vectors instead of OpenSearch Serverless. Recommended default for
  workshop-scale usage: pay-as-you-go, no ~4 OCU / ~$700-month floor like
  OpenSearch Serverless. Use bedrock_rag_template.yaml instead if you need
  OpenSearch Serverless's higher-QPS production RAG path.

  BedrockExecutionRole is prefixed "Recube-Sandbox-Role-": the workshop's sandbox AWS
  account has an SCP that denies any action to a role whose ARN doesn't match
  arn:aws:iam:::role/Recube-Sandbox-Role* -- without this prefix the role deploys fine but
  can't actually do anything.
# NOTE ON VALIDATION: AWS::S3Vectors::VectorBucket / AWS::S3Vectors::Index and the
# Bedrock::KnowledgeBase StorageConfiguration.Type=S3_VECTORS / S3VectorsConfiguration
# properties below were confirmed against the live AWS CloudFormation Template Reference
# docs on 2026-09-20 (aws-resource-s3vectors-vectorbucket.html, aws-resource-s3vectors-index.html,
# aws-properties-bedrock-knowledgebase-s3vectorsconfiguration.html). `cfn-lint`'s bundled
# resource spec predates these types/enum values and will falsely flag them (E3006/E3030/E3018) --
# that is a stale-local-spec issue, not a template error. Validate with `aws cloudformation
# validate-template` / an actual deploy rather than trusting cfn-lint here until it ships an
# updated spec.
Parameters:
  UUID:
    Type: String
    Description: Unique identifier to ensure resource name uniqueness.
  CreateKnowledgeBase:
    Type: String
    AllowedValues:
      - true
      - false
    Default: false
    Description: Set to true to create the Bedrock Knowledge Base after ensuring the vector index exists.
  CallerIdentity:
    Type: String
  EmbeddingModelId:
    Type: String
    # Default: Titan Embeddings v2 -- confirmed working live in this workshop's Knowledge Base flow.
    # Nova Multimodal Embeddings ("amazon.nova-2-multimodal-embeddings-v1:0") was tried as the
    # default first, but Bedrock's CreateKnowledgeBase rejects it without also configuring a
    # multimodal storage destination ("requires a multimodal storage destination" InvalidRequest,
    # confirmed live 2026-09-20) -- this template doesn't set that up, so Titan v2 is the one
    # that actually works out of the box. If you want to switch to Nova Multimodal Embeddings,
    # you'll need to add `SupplementalDataStorageConfiguration` (an S3 location) to the KB's
    # vectorKnowledgeBaseConfiguration first.
    Default: amazon.titan-embed-text-v2:0
    Description: Bedrock embedding model used by the Knowledge Base.
  EmbeddingDimensions:
    Type: Number
    # 256 is Titan Embeddings v2's smallest/cheapest supported output size, live-verified
    # working in UPGRADE_PLAN.md's live-verification pass.
    Default: 256
    Description: Output dimensionality of EmbeddingModelId. Must match a size the model actually supports.
Conditions:
  ShouldCreateKnowledgeBase: !Equals
    - !Ref CreateKnowledgeBase
    - true
Resources:

  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub kb-${UUID}-${AWS::Region}
      AccessControl: Private

  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !Sub arn:aws:s3:::kb-${UUID}-${AWS::Region}
              - !Sub arn:aws:s3:::kb-${UUID}-${AWS::Region}/*

  BedrockExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub Recube-Sandbox-Role-agent-s3v-${UUID}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - bedrock.amazonaws.com
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::kb-${UUID}-${AWS::Region}
                  - !Sub arn:aws:s3:::kb-${UUID}-${AWS::Region}/*
        - PolicyName: S3VectorsAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3vectors:*
                Resource: '*'
        - PolicyName: BedrockAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:*
                Resource: '*'

  VectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    # No VectorBucketName given on purpose -- CloudFormation generates a unique name,
    # avoiding collisions when multiple attendees deploy this template in the same account.

  VectorIndex:
    Type: AWS::S3Vectors::Index
    Properties:
      VectorBucketArn: !Ref VectorBucket
      DataType: float32
      Dimension: !Ref EmbeddingDimensions
      DistanceMetric: cosine
      # Required when bringing your own S3 Vectors index (vs. Bedrock's "quick create" flow,
      # which sets this up automatically): without it, Bedrock stores the full chunk text as
      # *filterable* metadata, capped at 2048 bytes regardless of chunk size -- causing
      # "Filterable metadata must have at most 2048 bytes" ingestion failures even with a
      # small MaxTokens. Marking these two Bedrock-reserved keys non-filterable moves them
      # into the 40KB total-metadata budget instead. Confirmed live 2026-09-20; see
      # https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
      # (Amazon S3 Vectors tab, "Create S3 vector bucket and index").
      MetadataConfiguration:
        NonFilterableMetadataKeys:
          - AMAZON_BEDROCK_TEXT
          - AMAZON_BEDROCK_METADATA

  BedrockKnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    Condition: ShouldCreateKnowledgeBase
    Properties:
      Name: !Sub kb-kb-s3v-${UUID}
      Description: Knowledge Base for Q&A Application using Bedrock, backed by S3 Vectors
      RoleArn: !GetAtt BedrockExecutionRole.Arn
      KnowledgeBaseConfiguration:
        Type: "VECTOR"
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}"
          EmbeddingModelConfiguration:
            BedrockEmbeddingModelConfiguration:
              Dimensions: !Ref EmbeddingDimensions
      StorageConfiguration:
        Type: "S3_VECTORS"
        S3VectorsConfiguration:
          VectorBucketArn: !Ref VectorBucket
          IndexArn: !Ref VectorIndex

  BedrockDataSource:
    Type: AWS::Bedrock::DataSource
    Condition: ShouldCreateKnowledgeBase
    Properties:
      Name: !Sub kb-data-s3v-${UUID}
      Description: Data Source for Bedrock Q&A Application
      KnowledgeBaseId: !Ref BedrockKnowledgeBase
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt S3Bucket.Arn
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: FIXED_SIZE
          FixedSizeChunkingConfiguration:
            # The real fix for "Filterable metadata must have at most 2048 bytes" is on
            # VectorIndex above (AMAZON_BEDROCK_TEXT/AMAZON_BEDROCK_METADATA marked
            # non-filterable) -- without that, Bedrock stores the full chunk text as
            # filterable metadata regardless of MaxTokens, and even small chunks can fail.
            # MaxTokens: 128 / OverlapPercentage: 1 confirmed working live 2026-09-20.
            MaxTokens: 128
            OverlapPercentage: 1
Outputs:
  S3BucketName:
    Value: !Ref S3Bucket
    Description: Name of the S3 bucket for document storage.
  BedrockExecutionRoleArn:
    Value: !GetAtt BedrockExecutionRole.Arn
    Description: ARN of the IAM role for Bedrock execution.
  VectorBucketArn:
    Value: !Ref VectorBucket
    Description: ARN of the S3 Vectors bucket.
  VectorIndexArn:
    Value: !Ref VectorIndex
    Description: ARN of the S3 Vectors index.
  BedrockKnowledgeBaseId:
    Condition: ShouldCreateKnowledgeBase
    Value: !Ref BedrockKnowledgeBase
    Description: ID of the Bedrock Knowledge Base.
  BedrockDataSourceId:
    Condition: ShouldCreateKnowledgeBase
    Value: !Ref BedrockDataSource
    Description: ID of the Bedrock Data Source.
